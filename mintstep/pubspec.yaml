name: mintstep
description: "MintStep - A production-ready Clean Architecture step-tracking and wellness application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Firebase Services (Lazy-initialized & Offline-capable)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8

  # Networking & HTTP client
  dio: ^5.4.0
  dartz: ^0.10.1

  # Local Database / Offline Cache
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

  # Mocking for Unit Tests
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
